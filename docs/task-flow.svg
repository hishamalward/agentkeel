<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AgentKeel task lifecycle</title>
  <desc id="desc">Declare a task, work in its linked worktree or in report-only mode, verify and checkpoint a persistent HTML report, then ship and clean up. AgentSlots can attach optional runtime resources. MCPClerk judges MCP calls independently of host permissions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#5573bf"/>
    </marker>
    <style>
      .bg{fill:#f7f8fb}.ink{fill:#202735}.muted{fill:#596577}.blue{fill:#3159b8}.teal{fill:#0b7775}.orange{fill:#a75d1f}
      .card{fill:#fff;stroke:#d8deea;stroke-width:2}.soft-blue{fill:#edf2ff}.soft-teal{fill:#eaf6f4}.soft-orange{fill:#fff3e6}
      .line{stroke:#5573bf;stroke-width:3;fill:none;marker-end:url(#arrow)}
      text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:1.5px}.heading{font-size:23px;font-weight:750}.body{font-size:16px}.small{font-size:15px}.num{font-size:14px;font-weight:800;fill:#fff}
      @media(prefers-color-scheme:dark){.bg{fill:#171a20}.ink{fill:#eef1f6}.muted{fill:#bac3d2}.card{fill:#222833;stroke:#3a4352}.soft-blue{fill:#27334f}.soft-teal{fill:#1e3837}.soft-orange{fill:#3b2d22}.line{stroke:#8aa8ff}.blue{fill:#a8beff}.teal{fill:#80d3c8}.orange{fill:#ffbd83}}
    </style>
  </defs>

  <rect class="bg" width="1280" height="760" rx="28"/>
  <text class="eyebrow blue" x="48" y="52">AGENTKEEL · TASK LIFECYCLE</text>
  <text class="ink" x="48" y="94" font-size="31" font-weight="750">From declared scope to a checked delivery</text>
  <text class="muted" x="48" y="125" font-size="17">Task records carry intent and evidence; Git and the project keep their existing roles.</text>

  <g transform="translate(40 166)">
    <rect class="card" width="278" height="292" rx="20"/>
    <circle cx="34" cy="36" r="18" fill="#3159b8"/><text class="num" x="34" y="41" text-anchor="middle">01</text>
    <text class="heading ink" x="64" y="44">Declare</text>
    <text class="body muted" x="24" y="91">
      <tspan x="24" dy="0">Record the goal, permissions,</tspan>
      <tspan x="24" dy="25">and persistent HTML report path.</tspan>
      <tspan x="24" dy="38">Choose the task size:</tspan>
    </text>
    <rect class="soft-blue" x="22" y="194" width="234" height="38" rx="10"/>
    <text class="small blue" x="36" y="219" font-weight="700">no-code · report only</text>
    <rect class="soft-blue" x="22" y="242" width="234" height="38" rx="10"/>
    <text class="small blue" x="36" y="267" font-weight="700">code · linked worktree</text>
  </g>

  <path class="line" d="M324 312h28"/>

  <g transform="translate(364 166)">
    <rect class="card" width="278" height="292" rx="20"/>
    <circle cx="34" cy="36" r="18" fill="#3159b8"/><text class="num" x="34" y="41" text-anchor="middle">02</text>
    <text class="heading ink" x="64" y="44">Work in scope</text>
    <text class="body muted" x="24" y="91">
      <tspan x="24" dy="0">Code: own linked worktree</tspan>
      <tspan x="24" dy="23">for tracked edits.</tspan>
      <tspan x="24" dy="34">No-code: read repository;</tspan>
      <tspan x="24" dy="23">write only external HTML</tspan>
      <tspan x="24" dy="23">report; no tracked edits.</tspan>
    </text>
    <rect class="soft-teal" x="22" y="239" width="234" height="39" rx="10"/>
    <text class="small teal" x="36" y="264" font-weight="700">Optional: AgentSlots runtime</text>
  </g>

  <path class="line" d="M648 312h28"/>

  <g transform="translate(688 166)">
    <rect class="card" width="278" height="292" rx="20"/>
    <circle cx="34" cy="36" r="18" fill="#3159b8"/><text class="num" x="34" y="41" text-anchor="middle">03</text>
    <text class="heading ink" x="64" y="44">Verify &amp; report</text>
    <text class="body muted" x="24" y="91">
      <tspan x="24" dy="0">Run checks; record outcomes</tspan>
      <tspan x="24" dy="23">and useful evidence.</tspan>
      <tspan x="24" dy="34">Save persistent HTML before</tspan>
      <tspan x="24" dy="23">handoff. It records the result</tspan>
      <tspan x="24" dy="23">and current code state.</tspan>
    </text>
    <rect class="soft-orange" x="22" y="239" width="234" height="39" rx="10"/>
    <text class="small orange" x="36" y="264" font-weight="700">Handoff checks the report</text>
  </g>

  <path class="line" d="M972 312h28"/>

  <g transform="translate(1012 166)">
    <rect class="card" width="228" height="292" rx="20"/>
    <circle cx="34" cy="36" r="18" fill="#3159b8"/><text class="num" x="34" y="41" text-anchor="middle">04</text>
    <text class="heading ink" x="64" y="44">Ship &amp; finish</text>
    <text class="body muted" x="22" y="91">
      <tspan x="22" dy="0">Exact verified SHA</tspan>
      <tspan x="22" dy="23">PR ship; pull protected</tspan>
      <tspan x="22" dy="23">canonical branch; or local</tspan>
      <tspan x="22" dy="23">fast-forward if allowed.</tspan>
      <tspan x="22" dy="23">Clean resources/worktree;</tspan>
      <tspan x="22" dy="23">save final HTML.</tspan>
      <tspan x="22" dy="23">No-code skips shipping.</tspan>
    </text>
    <rect class="soft-orange" x="18" y="239" width="192" height="39" rx="10"/>
    <text class="small orange" x="31" y="264" font-weight="700">Finish checks HTML</text>
  </g>

  <g transform="translate(40 500)">
    <rect class="soft-teal" width="586" height="150" rx="18"/>
    <text class="eyebrow teal" x="24" y="35">OPTIONAL RUNTIME · AGENTSLOTS</text>
    <text class="body ink" x="24" y="72">
      <tspan x="24" dy="0">Attach local resources per worktree.</tspan>
      <tspan x="24" dy="24">Release runtime; Keel cleans Git.</tspan>
    </text>
  </g>
  <g transform="translate(654 500)">
    <rect class="soft-blue" width="586" height="150" rx="18"/>
    <text class="eyebrow blue" x="24" y="35">MCP POLICY · MCPCLERK</text>
    <text class="body ink" x="24" y="72">
      <tspan x="24" dy="0">MCPClerk judges MCP calls.</tspan>
      <tspan x="24" dy="24">Host permissions stay separate.</tspan>
    </text>
  </g>
  <text class="small muted" x="48" y="704">Live Stop-hook enforcement is unverified; task handoff and finish enforce the report checkpoint.</text>
</svg>
